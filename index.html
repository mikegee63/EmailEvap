<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10 Minute Mail Clone</title>
  <style>
    /* Basic Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
      line-height: 1.6;
      padding: 20px;
    }
    
    header {
      background: #6190d3;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    header h1 {
      font-size: 2em;
      margin-bottom: 5px;
    }
    
    header h2 {
      font-size: 1.2em;
      font-weight: normal;
    }
    
    main {
      max-width: 900px;
      margin: 0 auto;
    }
    
    /* Email Section */
    #email-section {
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
    }
    
    #email-container {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    
    #mail_address {
      flex: 1;
      padding: 10px;
      font-size: 1.2em;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    
    #copy_address {
      margin-left: 10px;
      padding: 10px 15px;
      font-size: 1em;
      background: #6190d3;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    #timer-container {
      text-align: center;
    }
    
    #timer {
      font-size: 2em;
      display: block;
      margin-bottom: 10px;
    }
    
    #extend_time {
      padding: 8px 12px;
      font-size: 1em;
      background: #48a868;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    /* Inbox Section */
    #inbox {
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
    }
    
    #inbox h3 {
      margin-bottom: 15px;
    }
    
    #messages {
      min-height: 100px;
    }
    
    .message {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    
    .message:last-child {
      border-bottom: none;
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.8em;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>10 Minute Mail Clone</h1>
    <h2>Disposable Email Service</h2>
  </header>
  
  <main>
    <!-- Email Address and Timer Section -->
    <section id="email-section">
      <div id="email-container">
        <input type="text" id="mail_address" value="your-email@domain.com" readonly>
        <button id="copy_address">Copy</button>
      </div>
      <div id="timer-container">
        <span id="timer">10:00</span>
        <br>
        <button id="extend_time">Extend Time</button>
      </div>
    </section>
    
    <!-- Inbox Section -->
    <section id="inbox">
      <h3>Inbox (<span id="message_count">0</span>)</h3>
      <div id="messages">
        <!-- Dynamically loaded messages will appear here -->
      </div>
    </section>
  </main>
  
  <footer>
    <p>&copy; 2025 Your Company Name. All rights reserved.</p>
  </footer>
  
  <script>
    // Copy-to-Clipboard Functionality
    document.getElementById('copy_address').addEventListener('click', function() {
      const mailField = document.getElementById('mail_address');
      mailField.select();
      document.execCommand('copy');
      alert('Email address copied!');
    });
    
    // Timer Countdown Logic (Placeholder)
    let timeLeft = 600; // 10 minutes in seconds
    const timerElement = document.getElementById('timer');
    
    const timerInterval = setInterval(() => {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerElement.textContent = 
        (minutes < 10 ? '0' + minutes : minutes) + ':' +
        (seconds < 10 ? '0' + seconds : seconds);
      
      if(timeLeft > 0) {
        timeLeft--;
      } else {
        clearInterval(timerInterval);
        timerElement.textContent = "Expired";
      }
    }, 1000);
    
    // Extend Time Functionality (Placeholder)
    document.getElementById('extend_time').addEventListener('click', function() {
      // Example: add 10 more minutes
      timeLeft += 600;
    });
    
    // Load Messages Placeholder Function
    function loadMessages() {
      // This function should call your backend API to retrieve messages.
      // For now, we'll simulate by adding a dummy message.
      const messagesContainer = document.getElementById('messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message';
      messageDiv.innerHTML = `
        <strong>Sender Name</strong><br>
        Subject: Test Email<br>
        <small>Timestamp</small>
      `;
      messagesContainer.appendChild(messageDiv);
      
      // Update message count
      const messageCountEl = document.getElementById('message_count');
      const currentCount = parseInt(messageCountEl.textContent);
      messageCountEl.textContent = currentCount + 1;
    }
    
    // Simulate loading a message every 15 seconds for demonstration purposes.
    setInterval(loadMessages, 15000);
  </script>
</body>
</html>
