<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporary Email Viewer</title>
    <script>
        async function fetchEmails(tempEmail) {
            const response = await fetch(`/get-emails?email=${tempEmail}`);
            const data = await response.json();

            let emailList = document.getElementById("email-list");
            emailList.innerHTML = ""; // Clear existing emails

            data.messages.forEach(email => {
                let emailItem = document.createElement("div");
                emailItem.innerHTML = `
                    <strong>From:</strong> ${email.sender} <br>
                    <strong>Subject:</strong> ${email.subject} <br>
                    <strong>Message:</strong> ${email.body} <br><hr>
                `;
                emailList.appendChild(emailItem);
            });
        }

        // Example: Fetch emails every 5 seconds for a test email
        setInterval(() => fetchEmails("test123@emailvanish.com"), 5000);
    </script>
</head>
<body>
    <h1>Temporary Email Viewer</h1>
    <div id="email-list">Loading emails...</div>
</body>
</html>
