<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporary Email Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        .email-box {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            background: #e9e9e9;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .timer {
            font-size: 16px;
            color: #d9534f;
        }
        .email-list {
            text-align: left;
            margin-top: 20px;
        }
        .email-item {
            background: #fafafa;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        let userEmail = "";
        const userId = localStorage.getItem("userId") || Math.random().toString(36).substr(2, 9);
        localStorage.setItem("userId", userId);

        let timer;
        let timeLeft = 600; // 10 minutes in seconds

        async function generateEmail() {
            const response = await fetch(`/generate-email?userId=${userId}`);
            const data = await response.json();
            userEmail = data.email;
            document.getElementById("email-display").innerText = userEmail;
            console.log(`Generated Email: ${userEmail}`);
            resetTimer();
            fetchEmails();
        }

        async function fetchEmails() {
            if (!userEmail) return;
            console.log(`Fetching emails for: ${userEmail}`);
            const response = await fetch(`/get-emails?email=${userEmail}`);
            const data = await response.json();
            console.log("API Response:", data);

            let emailList = document.getElementById("email-list");
            emailList.innerHTML = ""; // Clear existing emails

            if (data.messages.length === 0) {
                emailList.innerHTML = "No new emails.";
            }

            data.messages.forEach(email => {
                let emailItem = document.createElement("div");
                emailItem.classList.add("email-item");
                emailItem.innerHTML = `
                    <strong>From:</strong> ${email.sender} <br>
                    <strong>Subject:</strong> ${email.subject} <br>
                    <strong>Message:</strong> ${email.body} <br><hr>
                `;
                emailList.appendChild(emailItem);
            });
        }

        function resetTimer() {
            clearInterval(timer);
            timeLeft = 600; // Reset to 10 minutes
            updateTimerDisplay();
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    generateEmail(); // Generate a new email when time runs out
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById("timer-display").innerText = `Time left: ${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
        }

        // Automatically generate an email on page load
        window.onload = async () => {
            await generateEmail();
            resetTimer();
            setInterval(fetchEmails, 5000); // Fetch new emails every 5 seconds
        };
    </script>
</head>
<body>
    <div class="container">
        <h1>Temporary Email Viewer</h1>
        <div class="email-box">Your Temporary Email: <span id="email-display">Loading...</span></div>
        <div class="timer">Time left: <span id="timer-display">10:00</span></div>
        <button onclick="resetTimer()">Reset Timer</button>
        <div class="email-list" id="email-list">Loading emails...</div>
    </div>
</body>
</html>
