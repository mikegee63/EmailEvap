<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    /* Ensure html and body fill full height for sticky footer */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    
    /* Common styling for header and footer */
    .header-footer {
      position: relative;
      background: #343a44;
      color: #fff;
      padding: 10px 0;
      text-align: center;
      width: 100%;
      z-index: 1000;
    }
    /* For the header, add a white bar at the bottom */
    header.header-footer::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -20px;  /* 20px tall white bar below the header */
      width: 100%;
      height: 20px;
      background: #fff;
      z-index: -1;
    }
    /* For the footer, add a white bar at the top */
    footer.header-footer::before {
      content: "";
      position: absolute;
      top: -20px;  /* 20px tall white bar above the footer */
      left: 0;
      width: 100%;
      height: 20px;
      background: #fff;
      z-index: -1;
    }
    
    /* Use flex layout on body to push footer to bottom if content is short */
    body {
      background: linear-gradient(to bottom, #e9e9e9 5%, #333333 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Ubuntu;
    }
    
    /* Main content area */
    main {
      flex: 1;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
    }
    
    /* Form styling */
    form {
      max-width: 600px;
      margin: 0 auto;
      background: #f9f9f9;
      border: 2px solid #ccc;
      padding: 20px;
      border-radius: 10px;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    
    button {
      background: #cc0000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      display: block;
      margin: 0 auto;
    }
    
    button:hover {
      background: #990000;
    }
    
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    #form-status {
      max-width: 600px;
      margin: 10px auto;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      display: none;
    }
    
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    /* Inner content container for header and footer columns */
    .header-footer > div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header-footer">
    <div>
      <!-- Left Column (optional) -->
      <div style="flex: 1; text-align: left;">
        <div style="flex: 1; text-align: left; padding: 0 10px;">
          <img 
            src="At-sign-TRANS2.png" 
            alt="Transparent at-sign graphic" 
            width="250" 
            height="100"/>
        </div>
      </div>
      <!-- Center Column -->
      <div style="flex: 1; text-align: center;">
      </div>
      <!-- Right Column -->
      <div style="flex: 1; text-align: right;">
      </div>
    </div>
  </header>
  
  <!-- Page Content -->
  <main>
    <h1>Contact Us</h1>
    
    <div id="form-status"></div>
    
    <!-- Contact form -->
    <form id="contact-form">
      <label>
        Your email:
        <input type="email" id="email" name="email" required>
      </label>
      <div aria-hidden="true" style="position:absolute;left:-9999px;height:0;overflow:hidden">
        <label>Website<input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></label>
      </div>
      <label>
        Your message:
        <textarea id="message" name="message" rows="5" required></textarea>
      </label>
      <button type="submit" id="submit-btn">Send</button>
    </form>
  </main>
  
  <!-- Footer -->
  <footer class="header-footer" id="page-footer">
    <div>
      <!-- Left Column (optional) -->
      <div style="flex: 1; text-align: left;">
        <div style="flex: 1; text-align: left; padding: 0 10px;">
          <img 
            src="At-sign-TRANS2.png" 
            alt="Transparent at-sign graphic" 
            width="250" 
            height="100"
          />
        </div>
      </div>
      <!-- Center Column -->
      <div style="flex: 1; text-align: center;">
        <p>
          <a href="about.html" style="color: #fff;">About</a> |
          <a href="privacy-policy.html" style="color: #fff;">Privacy</a> |
        <a href="premium.html" style="color: #fff;">Premium</a> |
          <a href="https://emailvanish.com" style="color: #fff;">Home</a>
        </p>
      </div>
      <!-- Right Column -->
      <div style="flex: 1; text-align: right;">
        <p>
          <a href="contact.html" style="color: #fff;">Contact</a> |
        <a href="premium.html?signin=1" style="color: #fff;">Sign in</a>
        </p>
      </div>
    </div>
  </footer>

  <script>
    const contactForm = document.getElementById('contact-form');
    const formStatus = document.getElementById('form-status');
    const submitBtn = document.getElementById('submit-btn');

    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      // Disable button and show loading state
      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending...';
      formStatus.style.display = 'none';

      try {
        const response = await fetch('/send-contact', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, message, website: (document.getElementById('website') || {}).value || '' }),
        });

        const result = await response.json();

        if (response.ok) {
          formStatus.innerText = result.success || 'Message sent successfully!';
          formStatus.className = 'success';
          formStatus.style.display = 'block';
          contactForm.reset();
        } else {
          throw new Error(result.error || 'Failed to send message');
        }
      } catch (error) {
        formStatus.innerText = error.message || 'Oops! Something went wrong. Please try again later.';
        formStatus.className = 'error';
        formStatus.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Send';
      }
    });
  </script>
  <script src="https://aisupportforge.com/w/9a627e856ee9a58fb27d.js" async></script>
</body>
</html>
