<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1604406379780489" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    /* Ensure html and body fill the full height for a sticky footer */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    
    /* Common styling for both header and footer */
    .header-footer {
      position: relative;
      background: #343a44;
      color: #fff;
      padding: 10px 0;
      text-align: center;
      width: 100%;
      z-index: 1000;
    }
    /* Add a 20px white bar trim above each element */
    .header-footer::before {
      content: "";
      position: absolute;
      top: -20px;
      left: 0;
      width: 100%;
      height: 20px;
      background: #fff;
      z-index: -1;
    }
    
    /* Use flex layout on body to push the footer to the bottom if content is short */
    body {
      background: linear-gradient(to bottom, #e9e9e9 5%, #333333 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Ubuntu;
    }
    
    /* Main content container */
    main {
      flex: 1;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
    }
    
    /* Form styling */
    form {
      max-width: 600px;
      margin: 0 auto;
      background: #f9f9f9;
      border: 2px solid #ccc;
      padding: 20px;
      border-radius: 10px;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    
    button {
      background: #cc0000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
      display: block;
      margin: 0 auto;
    }
    button:hover {
      background: #990000;
    }
    
    .success, .error {
      max-width: 600px;
      margin: 0 auto 10px auto;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
    
    /* Optional: Style inner columns for header/footer */
    .header-footer > div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 10px;
    }
  </style>
  <!-- Load reCAPTCHA API -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <!-- Header (identical to footer) -->
  <header class="header-footer">
    <div>
      <!-- Left Column (optional) -->
      <div style="flex: 1; text-align: left;">
        <!-- You may place a logo or additional text here -->
      </div>
      <!-- Center Column -->
      <div style="flex: 1; text-align: center;">
        <p>
          <a href="about.html" style="color: #fff;">About</a> |
          <a href="privacy-policy.html" style="color: #fff;">Privacy Policy</a> |
          <a href="https://emailvanish.com" style="color: #fff;">Home</a>
        </p>
      </div>
      <!-- Right Column -->
      <div style="flex: 1; text-align: right;">
        <p>
          <a href="contact.html" style="color: #fff;">Contact</a>
        </p>
      </div>
    </div>
  </header>
  
  <!-- Page Content -->
  <main>
    <h1>Contact Us</h1>
    
    <!-- Example success/error messages (optional) -->
    <!--
    <div class="success">Your message was sent successfully!</div>
    <div class="error">Oops! Something went wrong. Please try again.</div>
    -->
    
    <!-- Contact form -->
    <form action="https://formspree.io/f/mrbedgzg" method="POST">
      <label>
        Your email:
        <input type="email" name="email" required>
      </label>
      <label>
        Your message:
        <textarea name="message" rows="5" required></textarea>
      </label>
      <!-- Additional fields can be added here -->
      <button type="submit">Send</button>
    </form>
  </main>
  
  <!-- Footer (identical to header) -->
  <footer class="header-footer" id="page-footer">
    <div>
      <!-- Left Column (optional) -->
      <div style="flex: 1; text-align: left;">
        <!-- Optional content -->
      </div>
      <!-- Center Column -->
      <div style="flex: 1; text-align: center;">
        <p>
          <a href="about.html" style="color: #fff;">About</a> |
          <a href="privacy-policy.html" style="color: #fff;">Privacy Policy</a> |
          <a href="https://emailvanish.com" style="color: #fff;">Home</a>
        </p>
      </div>
      <!-- Right Column -->
      <div style="flex: 1; text-align: right;">
        <p>
          <a href="contact.html" style="color: #fff;">Contact</a>
        </p>
      </div>
    </div>
  </footer>
</body>
</html>
