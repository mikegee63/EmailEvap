<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    /* Basic styling for the form */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    form {
      max-width: 600px;
      margin: 0 auto;
      background: #f9f9f9;
      border: 2px solid #ccc;
      padding: 20px;
      border-radius: 10px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #cc0000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background: #990000;
    }
    .success, .error {
      max-width: 600px;
      margin: 0 auto;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      margin-bottom: 10px;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
  <!-- Load reCAPTCHA API -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <h1>Contact Us</h1>

  <!-- Single form with reCAPTCHA and Formspree -->
  <form id="my-form" action="https://formspree.io/f/mrbedgzg" method="POST">
    <label>Email:</label>
    <input type="email" name="email" required />
    
    <label>Message:</label>
    <input type="text" name="message" required />

    <!-- Google reCAPTCHA -->
    <div class="g-recaptcha" data-sitekey="6LfTsN4qAAAAAL5ahUWs945SdmvUaLnMA_oyNuj2"></div>
    
    <input type="hidden" name="g-recaptcha-response" id="recaptcha-response">
    
    <button id="my-form-button" type="submit">Submit</button>
    <p id="my-form-status"></p>
  </form>

  <script>
    var form = document.getElementById("my-form");

    async function handleSubmit(event) {
      event.preventDefault();
      var status = document.getElementById("my-form-status");
      var recaptchaResponse = grecaptcha.getResponse();

      if (!recaptchaResponse) {
        status.innerHTML = "Please complete the reCAPTCHA before submitting.";
        return; // Stop form submission
      }

      var data = new FormData(event.target);
      data.append("g-recaptcha-response", recaptchaResponse);

      fetch(event.target.action, {
        method: form.method,
        body: data,
        headers: {
            'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          status.innerHTML = "Thanks for your submission!";
          form.reset();
          grecaptcha.reset(); // Reset reCAPTCHA
        } else {
          response.json().then(data => {
            if (Object.hasOwn(data, 'errors')) {
              status.innerHTML = data["errors"].map(error => error["message"]).join(", ")
            } else {
              status.innerHTML = "Oops! There was a problem submitting your form."
            }
          })
        }
      }).catch(error => {
        status.innerHTML = "Oops! There was a problem submitting your form.";
      });
    }

    form.addEventListener("submit", handleSubmit);
  </script>

</body>
</html>
