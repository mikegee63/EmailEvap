<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1604406379780489"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    /* Make body and html fill the full height to enable sticky footer */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* Use flex layout on body to push footer to bottom if content is short */
    body {
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    /* A container (main) for your page content (the form, headings, etc.) */
    main {
      flex: 1;               /* This expands to fill remaining space */
      padding: 20px;         /* Some padding around your content */
    }

    h1 {
      text-align: center;
    }

    /* Basic styling for the form */
    form {
      max-width: 600px;
      margin: 0 auto;
      background: #f9f9f9;
      border: 2px solid #ccc;
      padding: 20px;
      border-radius: 10px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #cc0000;
      color: #fff;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background: #990000;
    }
    .success, .error {
      max-width: 600px;
      margin: 0 auto 10px auto;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
    }

    /* Sticky footer at the bottom */
    footer {
      background: #343a44; /* office grey/brown */
      color: #fff;
      padding: 10px 0;
      text-align: center;
    }
  </style>
  <!-- Load reCAPTCHA API -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <!-- Page Content -->
  <main>
    <h1>Contact Us</h1>

    <!-- Example success/error messages (optional) -->
    <!--
    <div class="success">Your message was sent successfully!</div>
    <div class="error">Oops! Something went wrong. Please try again.</div>
    -->

    <!-- Your form with reCAPTCHA and Formspree -->
    <form
      action="https://formspree.io/f/mrbedgzg"
      method="POST"
    >
      <label>
        Your email:
        <input type="email" name="email" required>
      </label>
      <label>
        Your message:
        <textarea name="message" rows="5" required></textarea>
      </label>
      <!-- Add other form fields here if needed -->

      <button type="submit">Send</button>
    </form>
  </main>

  <!-- Sticky Footer -->
  <footer id="page-footer">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; max-width: 900px; margin: 0 auto;">
      
      <!-- Left Column (optional) -->
      <div style="flex: 1; text-align: left; padding: 0 10px;">
        <!-- Put any text or links here if desired -->
      </div>
      
      <!-- Center Column -->
      <div style="flex: 1; text-align: center; padding: 0 10px;">
        <p>
          <a href="about.html" style="color: #fff;">About</a> |
          <a href="privacy-policy.html" style="color: #fff;">Privacy Policy</a> |
          <a href="https://emailvanish.com" style="color: #fff;">Home</a>
        </p>
      </div>
      
      <!-- Right Column -->
      <div style="flex: 1; text-align: right; padding: 0 10px;">
        <p>
          <a href="contact.html" style="color: #fff;">Contact</a>
        </p>
      </div>
    </div>
  </footer>

</body>
</html>
